<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dress Up Game</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
    <link rel="stylesheet" href="style.css?v=5">
    <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
</head>
<body>

    <div id="game-container">
        <img id="bg" src="assets/bg.png">
        <img id="character" src="assets/base_body.png">
        <img id="hair-layer">
        <img id="outfit-layer">

        <button id="undo-btn"><img src="assets/undo.png"></button>
        <button id="redo-btn"><img src="assets/redo.png"></button>

        <div id="panel" hidden>
            <img id="panel-bg" src="assets/panel.png">
            <button id="close-btn"><img src="assets/x_button.png"></button>

            <!-- Hair Options Panel -->
            <div id="hair-options" class="hidden">
              <div class="panel-page" id="hair-page-1">
                <button id="hair-blonde-btn"><img src="assets/thumbnails/blonde_hair_thumb.png"></button>
                <button id="hair-brunette-btn"><img src="assets/thumbnails/brunette_hair_thumb.png"></button>
                <button id="hair-wavy-brunette-btn"><img src="assets/thumbnails/wavy_brunette_hair_thumb.png"></button>
              </div>
              <div class="panel-page hidden" id="hair-page-2">
                <button id="hair-long-espresso-bangs-btn"><img src="assets/thumbnails/long_espresso_bangs_hair_thumb.png"></button>
                <button id="hair-long-black-btn"><img src="assets/thumbnails/long_black_hair_thumb.png"></button>
              </div>
              <div class="pagination-controls">
                <button id="hair-prev-btn"><img src="assets/arrow_left.png"></button>
                <button id="hair-next-btn"><img src="assets/arrow_right.png"></button>
              </div>
            </div>

            <!-- Outfit Options Panel -->
            <div id="outfit-options" class="hidden">
              <div class="panel-page" id="outfit-page-1">
                <button id="outfit-casual-btn"><img src="assets/thumbnails/casual_outfit_thumb.png"></button>
                <button id="outfit-dress-btn"><img src="assets/thumbnails/dress_outfit_thumb.png"></button>
              </div>
              <div class="panel-page hidden" id="outfit-page-2">
                <button id="outfit-cardigan-dress-btn"><img src="assets/thumbnails/cardigan_dress_outfit_thumb.png"></button>
                <button id="outfit-blazer-trousers-btn"><img src="assets/thumbnails/blazer_trousers_outfit_thumb.png"></button>
              </div>
              <div class="pagination-controls">
                <button id="outfit-prev-btn"><img src="assets/arrow_left.png"></button>
                <button id="outfit-next-btn"><img src="assets/arrow_right.png"></button>
              </div>
            </div>


        </div>

        <button id="hair-menu-btn"><img src="assets/hair_icon.png"></button>
        <button id="outfit-menu-btn"><img src="assets/outfit_icon.png"></button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <script type="py" src="main.py"></script>

</body>
</html>
